  // ── Character Switcher Logic ──────────────────────────────────────────────
  (function() {
    const STORAGE_KEY = 'kata-character';
    const DEFAULT_CHAR = 'default';

    function getActiveCharacter() {
      try {
        return localStorage.getItem(STORAGE_KEY) || DEFAULT_CHAR;
      } catch {
        return DEFAULT_CHAR;
      }
    }

    function setActiveCharacter(charKey) {
      try {
        localStorage.setItem(STORAGE_KEY, charKey);
      } catch {}
      applyCharacter(charKey);
    }

    function applyCharacter(charKey) {
      document.body.dataset.character = charKey;

      // Update switcher button states
      document.querySelectorAll('.character-switcher__btn').forEach(function(btn) {
        const key = btn.getAttribute('data-character-key');
        btn.setAttribute('aria-pressed', key === charKey ? 'true' : 'false');
      });

      // Dispatch event for any listeners
      window.dispatchEvent(new CustomEvent('character-changed', { detail: { character: charKey } }));
    }

    // Apply on load (before paint — this script is inline)
    applyCharacter(getActiveCharacter());

    // Listen for clicks
    document.addEventListener('click', function(e) {
      var btn = e.target.closest('.character-switcher__btn');
      if (!btn) return;
      var charKey = btn.getAttribute('data-character-key');
      if (charKey) {
        setActiveCharacter(charKey);
      }
    });

    // Re-apply after Astro client-side navigation (View Transitions)
    document.addEventListener('astro:after-swap', function() {
      applyCharacter(getActiveCharacter());
    });
  })();
